<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MemoFlip</title>
    <link rel="stylesheet" href="./styles/tailwind.css" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="app-body">
    <header class="app-header">
      <h1 class="app-title">MemoFlip</h1>
      <div class="app-header-actions">
        <button id="history-btn" class="icon-button" type="button" aria-label="履歴">📊</button>
        <button id="theme-btn" class="icon-button" type="button" aria-label="テーマ切替">
          <span id="theme-icon">🌙</span>
        </button>
        <button id="setting-btn" class="icon-button" type="button" aria-label="設定">⚙️</button>
      </div>
    </header>

    <main id="app-main" class="app-main">
      <!-- 画面コンテンツ（ホーム / 演習 / 結果）はここに描画される -->
    </main>

    <!-- モーダル -->
    <div id="modal-root"></div>
    <!-- トースト -->
    <div id="toast-root" class="toast-root"></div>

    <script type="module" src="../app/app.ts"></script>
  </body>
</html>
